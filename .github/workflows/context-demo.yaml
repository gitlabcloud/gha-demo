name: Context variables demo
on: push
jobs:
  context-demo:
    runs-on: ubuntu-22.04
    steps:
      - name: Use context variables
        run: |
          echo " This workflow is triggered by ${{ github.actor }}"
          echo " The repository name is ${{ github.repository }}"
          echo "The is event name ${{ github.event_name }}"
          echo "This is the name of node id ${{ github.node_id }}"
      - name: Print all variable under github
        run: echo "${{ toJson(github) }}"
